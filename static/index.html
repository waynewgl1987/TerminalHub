<!DOCTYPE html>
<html lang="zh" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TerminalHub</title>
  <!-- Fonts & icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" />
  <!-- Bootstrap 5.3 CSS (structure, reset, utilities) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  <!-- xterm -->
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm@5.3.0/css/xterm.css" />
  <!-- Highlight.js (syntax highlighting for diff modal) -->
  <link rel="stylesheet" id="hljs-theme-light" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css" />
  <link rel="stylesheet" id="hljs-theme-dark" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark-dimmed.min.css" disabled />
  <!-- App styles (override/extend Bootstrap) -->
  <link rel="stylesheet" href="/static/css/styles.css?v=5" />
  <!-- Anti-FOUC: keep body invisible until app.js signals it's ready.
       The transition makes the reveal smooth instead of a sudden pop. -->
  <style>body { opacity: 0; transition: opacity 0.2s ease; }</style>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <div class="brand-logo">
        <i class="bi bi-terminal-fill"></i>
      </div>
      <div>
        <h1>TerminalHub</h1>
        <p data-i18n="appSubtitle">实时终端管理平台</p>
      </div>
    </div>
    <div class="topbar-actions">
      <button id="langToggle" class="icon-btn" title="Language">
        <i class="bi bi-translate"></i>
      </button>
      <button id="themeToggle" class="icon-btn" title="Theme">
        <i class="bi bi-circle-half"></i>
      </button>
      <button id="openAIPanel" class="primary-btn" data-i18n="aiSettings">
        <i class="bi bi-robot me-1"></i>AI 设置
      </button>
    </div>
  </header>

  <section class="dashboard-summary">
    <div class="summary-card">
      <div class="summary-card-icon"><i class="bi bi-cpu-fill"></i></div>
      <div>
        <span data-i18n="systemCpu">系统 CPU</span>
        <strong id="systemCpuValue">0%</strong>
      </div>
    </div>
    <div class="summary-card">
      <div class="summary-card-icon"><i class="bi bi-memory"></i></div>
      <div>
        <span data-i18n="systemMemory">系统内存</span>
        <strong id="systemMemValue">0 GB</strong>
      </div>
    </div>
    <div class="summary-card">
      <div class="summary-card-icon"><i class="bi bi-terminal-fill"></i></div>
      <div>
        <span data-i18n="activeTerminals">活跃终端</span>
        <strong id="terminalCountValue">0</strong>
      </div>
    </div>
    <div class="summary-card">
      <div class="summary-card-icon"><i class="bi bi-stars"></i></div>
      <div>
        <span data-i18n="detectedAI">检测到 AI</span>
        <strong id="aiCountValue">0</strong>
      </div>
    </div>
  </section>

  <div id="fabSentinel" class="fab-sentinel"></div>
  <div class="fab-container" id="fabContainer">
    <button id="newTerminalBtn" class="fab" data-i18n-title="newTerminal">
      <i class="bi bi-plus-lg fab-plus"></i>
      <span class="fab-label" data-i18n="newTerminal">新建终端</span>
    </button>
  </div>

  <main>
    <div id="terminalGrid" class="terminal-grid"></div>
  </main>

  <!-- ── Report Viewer Panel (embedded iframe) ────────────────────────────── -->
  <div id="reportPanelOverlay" class="report-panel-overlay hidden"></div>
  <aside id="reportPanel" class="report-panel hidden" role="dialog" aria-label="Report Viewer">
    <div class="report-panel-header">
      <div class="report-panel-title">
        <i class="bi bi-file-earmark-text report-panel-icon"></i>
        <span id="reportPanelLabel" data-i18n="reportViewer">报告预览</span>
      </div>
      <div class="report-panel-actions">
        <a id="reportPanelOpenLink" href="#" target="_blank" class="icon-btn" title="在新标签页打开">
          <i class="bi bi-box-arrow-up-right"></i>
        </a>
        <button id="reportPanelClose" class="icon-btn" aria-label="Close">
          <i class="bi bi-x-lg"></i>
        </button>
      </div>
    </div>
    <iframe id="reportPanelFrame" class="report-panel-frame" sandbox="allow-scripts allow-same-origin allow-forms allow-popups" title="Report"></iframe>
  </aside>

  <!-- ── Global progress toast ─────────────────────────────────────────── -->
  <div id="progressToast" class="progress-toast hidden" role="status" aria-live="polite">
    <div class="progress-toast-header">
      <span class="progress-spinner"></span>
      <span id="progressLabel" class="progress-label">Loading…</span>
      <button id="progressClose" class="progress-close" aria-label="close">
        <i class="bi bi-x"></i>
      </button>
    </div>
    <div class="progress-bar-track">
      <div id="progressBar" class="progress-bar-fill"></div>
    </div>
    <div id="progressSteps" class="progress-steps"></div>
  </div>

  <div id="modalOverlay" class="modal-overlay hidden"></div>

  <section id="newTerminalModal" class="th-modal hidden">
    <div class="modal-header">
      <h2><i class="bi bi-plus-circle me-2"></i><span data-i18n="newTerminal">新建终端</span></h2>
      <button class="icon-btn modal-close" data-close-modal="newTerminalModal">
        <i class="bi bi-x-lg"></i>
      </button>
    </div>
    <form id="newTerminalForm" class="form-grid">
      <label>
        <span data-i18n="shell">Shell</span>
        <select name="shell" id="shellSelect">
          <option value="/bin/zsh">zsh</option>
          <option value="/bin/bash">bash</option>
          <option value="/bin/sh">sh</option>
          <option value="/opt/homebrew/bin/fish">fish</option>
          <option value="cmd.exe">cmd</option>
          <option value="powershell.exe">powershell</option>
        </select>
      </label>
      <label>
        <span data-i18n="title">标题</span>
        <input type="text" name="title" placeholder="Terminal title" data-i18n-placeholder="titlePlaceholder" />
      </label>
      <label>
        <span data-i18n="cwd">工作目录</span>
        <input type="text" name="cwd" placeholder="/path/to/project" data-i18n-placeholder="cwdPlaceholder" />
        <span class="path-drag-hint" data-i18n="dragPathHint">📂 可直接拖入文件夹</span>
      </label>
      <label>
        <span data-i18n="watchPath">监听目录</span>
        <input type="text" name="watch_path" placeholder="/path/to/watch" data-i18n-placeholder="watchPathPlaceholder" />
        <span class="path-drag-hint" data-i18n="dragPathHint">📂 可直接拖入文件夹</span>
      </label>
      <label class="full-width">
        <span data-i18n="description">描述</span>
        <textarea name="description" rows="3" placeholder="Describe the task" data-i18n-placeholder="descriptionPlaceholder"></textarea>
      </label>
      <div class="modal-actions full-width">
        <button type="button" class="ghost-btn" data-close-modal="newTerminalModal" data-i18n="cancel">取消</button>
        <button id="createTerminalSubmit" type="submit" class="primary-btn" data-i18n="create">
          <i class="bi bi-plus-circle me-1"></i>创建
        </button>
      </div>
    </form>
  </section>

  <aside id="aiPanel" class="ai-panel hidden">
    <div class="modal-header">
      <h2><i class="bi bi-robot me-2"></i><span data-i18n="aiSettings">AI 设置</span></h2>
      <button id="closeAIPanel" class="icon-btn"><i class="bi bi-x-lg"></i></button>
    </div>
    <div class="panel-body form-grid">
      <label>
        <span data-i18n="provider">提供商</span>
        <select id="aiProvider"></select>
      </label>
      <label>
        <span data-i18n="model">模型</span>
        <select id="aiModel"></select>
      </label>
      <label>
        <span data-i18n="baseUrl">Base URL</span>
        <input id="aiBaseUrl" type="text" placeholder="https://api.openai.com/v1" />
      </label>
      <label>
        <span data-i18n="apiKey">API Key</span>
        <input id="aiApiKey" type="password" placeholder="sk-..." />
      </label>
      <div class="panel-status full-width">
        <span id="aiStatusDot" class="status-dot"></span>
        <span id="aiStatusText" data-i18n="notTested">未测试</span>
      </div>
      <div class="modal-actions full-width">
        <button id="testAIConnection" type="button" class="ghost-btn" data-i18n="testConnection">
          <i class="bi bi-wifi me-1"></i>测试连接
        </button>
        <button id="saveAIConfig" type="button" class="primary-btn" data-i18n="save">
          <i class="bi bi-check-lg me-1"></i>保存
        </button>
      </div>
    </div>
  </aside>

  <section id="diffModal" class="th-modal th-modal-wide hidden">
    <div class="modal-header">
      <h2><i class="bi bi-code-slash me-2"></i><span data-i18n="codeChanges">代码变更</span></h2>
      <div class="modal-actions-inline">
        <button id="emailReportBtn" class="ghost-btn" data-i18n="sendEmail">
          <i class="bi bi-envelope me-1"></i>发送邮件
        </button>
        <button class="icon-btn modal-close" data-close-modal="diffModal">
          <i class="bi bi-x-lg"></i>
        </button>
      </div>
    </div>
    <div id="diffModalContent" class="diff-modal-content"></div>
  </section>

  <section id="emailModal" class="th-modal hidden">
    <div class="modal-header">
      <h2><i class="bi bi-envelope me-2"></i><span data-i18n="sendEmail">发送邮件</span></h2>
      <button class="icon-btn modal-close" data-close-modal="emailModal">
        <i class="bi bi-x-lg"></i>
      </button>
    </div>
    <form id="emailForm" class="form-grid">
      <label>
        <span data-i18n="emailTo">收件人</span>
        <input name="to" type="email" required placeholder="name@example.com" />
      </label>
      <label>
        <span data-i18n="emailSubject">主题</span>
        <input name="subject" type="text" required placeholder="TerminalHub Report" />
      </label>
      <label>
        <span data-i18n="smtpHost">SMTP Host</span>
        <input name="smtp_host" type="text" placeholder="smtp.gmail.com" />
      </label>
      <label>
        <span data-i18n="smtpPort">SMTP Port</span>
        <input name="smtp_port" type="number" placeholder="587" />
      </label>
      <label>
        <span data-i18n="smtpUser">SMTP User</span>
        <input name="smtp_user" type="text" />
      </label>
      <label>
        <span data-i18n="smtpPass">SMTP Password</span>
        <input name="smtp_pass" type="password" />
      </label>
      <div class="modal-actions full-width">
        <button type="button" class="ghost-btn" data-close-modal="emailModal" data-i18n="cancel">取消</button>
        <button type="submit" class="primary-btn" data-i18n="send">
          <i class="bi bi-send me-1"></i>发送
        </button>
      </div>
    </form>
  </section>

  <script src="https://cdn.jsdelivr.net/npm/xterm@5.3.0/lib/xterm.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xterm-addon-fit@0.8.0/lib/xterm-addon-fit.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xterm-addon-web-links@0.9.0/lib/xterm-addon-web-links.js"></script>
  <!-- Highlight.js core + all common languages (full CDN bundle) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
  <script src="/static/js/i18n.js?v=2"></script>
  <script src="/static/js/ai_panel.js?v=2"></script>
  <script src="/static/js/terminal.js?v=2"></script>
  <script src="/static/js/report.js?v=5"></script>
  <script src="/static/js/app.js?v=3"></script>
</body>
</html>
