[app]
name = TerminalHub
version = v1.0.0
port = 8765
host = 0.0.0.0
default_shell_unix = /bin/zsh
default_shell_windows = cmd.exe
default_lang = zh
default_theme = light

[monitoring]
stats_interval = 2
log_max_lines = 5000
code_changes_file = tmp/code_changes_{terminal_id}.json

[email]
smtp_host = smtp.gmail.com
smtp_port = 587
smtp_user =
smtp_pass =
